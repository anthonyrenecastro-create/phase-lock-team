replicaCount: 1

image:
  repository: ghcr.io/anthonyrenecastro-create/phase-lock-rag-api-llm-data-drift-preventer
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

env:
  deterministicMode: "true"
  driftSpikeThreshold: "0.80"
  breakerTripCount: "3"
  maxMetricWindow: "4096"
  maxComputeSteps: "50000"
  gatewayApiKey: ""
