[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-lock-gateway"
version = "0.1.0"
description = "FastAPI gateway for HRM manifold-surgery drift stabilization"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0,<0.112.0",
  "uvicorn[standard]>=0.30.1,<0.31.0",
  "pydantic>=2.8.2,<3.0.0",
  "python-multipart>=0.0.9,<0.1.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
]

[project.scripts]
phase-lock-gateway = "gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]
