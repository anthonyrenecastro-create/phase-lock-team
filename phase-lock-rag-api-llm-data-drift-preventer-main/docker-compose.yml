version: "3.9"

services:
  phase-lock-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phase-lock-gateway
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
